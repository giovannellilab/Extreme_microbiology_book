title: Microbiology of Extreme Environments

author: >
  Giovannelli Lab, built with
  <a href="https://teachbooks.io">TeachBooks</a> and
  <a href="https://jupyterbook.org/">Jupyter Book</a>,
  licensed under
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/"
     target="_blank"
     rel="license noopener noreferrer">
    CC BY-NC-SA 4.0
  </a>

execute:
  execute_notebooks: "off"

only_build_toc_files: true

html:
  baseurl: "https://giovannellilab.github.io/Extreme_microbiology_book/"

sphinx:
  config:
    html_css_files:
      - print.css

    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js

    thebe_config:
      use_thebe_lite: true
      exclude_patterns:
        - "**/_*.yml"
        - "**/*.md"
        - "**/*.ipynb"

    html_theme_options:
      logo:
        text: Microbiology of Extreme Environments
        image_light: Cover_MEE_book.svg
        image_dark: Cover_MEE_book.svg

      repository_url: "https://github.com/giovannellilab/Extreme_microbiology_book/"
      path_to_docs: "book"
      repository_branch: "main"
      use_edit_page_button: true
      use_repository_button: true
      use_issues_button: true

      launch_buttons:
        thebe: true

    html_show_copyright: false
    html_last_updated_fmt: "%B %-d, %Y"
    html_static_path:
      - figures
      - _static

    mathjax3_config:
      chtml:
        mtextInheritFont: true

  extra_extensions:
    - sphinx.ext.imgconverter
    - jupyterbook_patches
    - download_link_replacer
    - sphinx.ext.extlinks
    - sphinx_image_inverter
    - sphinx_exercise
    - teachbooks_sphinx_tippy

bibtex_bibfiles:
  - ../references/bibliography.bib

csl: ../references/nature.csl