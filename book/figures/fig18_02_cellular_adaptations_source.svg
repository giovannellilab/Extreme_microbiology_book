<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="135mm" viewBox="0 0 1800 1350" role="img" aria-labelledby="title desc">
  <title id="title">Thermophile cellular adaptations</title>
  <desc id="desc">A central thermophilic archaeal cell is linked to three scientific-plate insets showing a low-permeability archaeal membrane, protein folding and chaperonin quality control, and DNA organisation and repair. The adaptations are illustrative and lineage-specific rather than universal.</desc>
  <rect width="1800" height="1350" fill="#ffffff"/>
  <image href="fig18_02_cellular_adaptations_source_base.png" x="9" y="158" width="1782" height="1188" preserveAspectRatio="xMidYMid meet"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263332">
    <text x="72" y="72" font-size="56" font-weight="700">Thermophile cellular adaptations</text>
    <text x="74" y="118" font-size="31" fill="#52615f">Three interacting maintenance problems in a hot archaeal cell</text>

    <g style="paint-order:stroke fill" stroke="#ffffff" stroke-width="10" stroke-linejoin="round">
      <text x="58" y="218" font-size="43" font-weight="700"><tspan>A</tspan><tspan x="108">Membrane barrier</tspan></text>
      <text x="108" y="259" font-size="33" font-weight="400">reduced ion leakage</text>

      <text x="1230" y="215" font-size="43" font-weight="700"><tspan>B</tspan><tspan x="1280">Protein quality control</tspan></text>
      <text x="1280" y="256" font-size="33" font-weight="400">stable folds • chaperonin cycle</text>

      <text x="1180" y="795" font-size="43" font-weight="700"><tspan>C</tspan><tspan x="1230">Genome integrity</tspan></text>
      <text x="1230" y="836" font-size="33" font-weight="400">DNA organisation • repair</text>

      <text x="565" y="1248" font-size="36" font-weight="700">Thermophilic archaeal cell</text>
      <text x="475" y="1293" font-size="31" font-weight="400">All three systems contribute to whole-cell proliferation</text>
    </g>

    <text x="1740" y="1320" text-anchor="end" font-size="30" fill="#52615f">Illustrative, lineage-specific adaptations; not a universal cellular recipe.</text>
  </g>
</svg>
