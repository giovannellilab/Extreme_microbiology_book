<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="108mm" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Cardinal temperature ranges</title>
  <desc id="desc">A schematic temperature axis compares overlapping growth envelopes and optimum zones for psychrophiles, mesophiles, thermophiles and hyperthermophiles. A separate marker identifies verified proliferation of Methanopyrus kandleri strain 116 at 122 degrees Celsius under high-pressure culture conditions.</desc>
  <rect width="1800" height="1080" fill="#ffffff"/>
  <defs>
    <linearGradient id="psy" x1="0" x2="1"><stop offset="0" stop-color="#6e9fa4" stop-opacity="0.20"/><stop offset="0.5" stop-color="#6e9fa4" stop-opacity="0.58"/><stop offset="1" stop-color="#6e9fa4" stop-opacity="0.20"/></linearGradient>
    <linearGradient id="mes" x1="0" x2="1"><stop offset="0" stop-color="#7b9a77" stop-opacity="0.20"/><stop offset="0.5" stop-color="#7b9a77" stop-opacity="0.58"/><stop offset="1" stop-color="#7b9a77" stop-opacity="0.20"/></linearGradient>
    <linearGradient id="therm" x1="0" x2="1"><stop offset="0" stop-color="#c58b42" stop-opacity="0.20"/><stop offset="0.5" stop-color="#c58b42" stop-opacity="0.62"/><stop offset="1" stop-color="#c58b42" stop-opacity="0.20"/></linearGradient>
    <linearGradient id="hyper" x1="0" x2="1"><stop offset="0" stop-color="#a95e43" stop-opacity="0.20"/><stop offset="0.55" stop-color="#a95e43" stop-opacity="0.62"/><stop offset="1" stop-color="#a95e43" stop-opacity="0.20"/></linearGradient>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263332">
    <text x="72" y="72" font-size="56" font-weight="700">Cardinal temperature ranges</text>
    <text x="74" y="118" font-size="31" fill="#52615f">Approximate, overlapping growth envelopes and optimum zones</text>

    <g font-size="31" fill="#52615f">
      <rect x="1015" y="66" width="120" height="24" rx="12" fill="#9b8e79" fill-opacity="0.28" stroke="#7d7467" stroke-width="2"/>
      <text x="1152" y="89">approximate growth envelope</text>
      <line x1="1015" x2="1135" y1="119" y2="119" stroke="#7d7467" stroke-width="12" stroke-linecap="round"/>
      <text x="1152" y="129">typical optimum zone</text>
    </g>

    <g stroke="#d8ddda" stroke-width="2">
      <line x1="300" y1="210" x2="300" y2="895"/>
      <line x1="396" y1="210" x2="396" y2="895"/>
      <line x1="492" y1="210" x2="492" y2="895"/>
      <line x1="588" y1="210" x2="588" y2="895"/>
      <line x1="684" y1="210" x2="684" y2="895"/>
      <line x1="780" y1="210" x2="780" y2="895"/>
      <line x1="876" y1="210" x2="876" y2="895"/>
      <line x1="972" y1="210" x2="972" y2="895"/>
      <line x1="1068" y1="210" x2="1068" y2="895"/>
      <line x1="1164" y1="210" x2="1164" y2="895"/>
      <line x1="1260" y1="210" x2="1260" y2="895"/>
      <line x1="1356" y1="210" x2="1356" y2="895"/>
      <line x1="1452" y1="210" x2="1452" y2="895"/>
      <line x1="1548" y1="210" x2="1548" y2="895"/>
      <line x1="1644" y1="210" x2="1644" y2="895"/>
    </g>

    <g stroke="#263332" stroke-width="3">
      <line x1="300" y1="895" x2="1644" y2="895"/>
      <line x1="300" y1="895" x2="300" y2="910"/>
      <line x1="396" y1="895" x2="396" y2="910"/>
      <line x1="492" y1="895" x2="492" y2="910"/>
      <line x1="588" y1="895" x2="588" y2="910"/>
      <line x1="684" y1="895" x2="684" y2="910"/>
      <line x1="780" y1="895" x2="780" y2="910"/>
      <line x1="876" y1="895" x2="876" y2="910"/>
      <line x1="972" y1="895" x2="972" y2="910"/>
      <line x1="1068" y1="895" x2="1068" y2="910"/>
      <line x1="1164" y1="895" x2="1164" y2="910"/>
      <line x1="1260" y1="895" x2="1260" y2="910"/>
      <line x1="1356" y1="895" x2="1356" y2="910"/>
      <line x1="1452" y1="895" x2="1452" y2="910"/>
      <line x1="1548" y1="895" x2="1548" y2="910"/>
      <line x1="1644" y1="895" x2="1644" y2="910"/>
    </g>

    <g font-size="31" text-anchor="middle" fill="#52615f">
      <text x="300" y="950">−10</text><text x="396" y="950">0</text><text x="492" y="950">10</text>
      <text x="588" y="950">20</text><text x="684" y="950">30</text><text x="780" y="950">40</text>
      <text x="876" y="950">50</text><text x="972" y="950">60</text><text x="1068" y="950">70</text>
      <text x="1164" y="950">80</text><text x="1260" y="950">90</text><text x="1356" y="950">100</text>
      <text x="1452" y="950">110</text><text x="1548" y="950">120</text><text x="1644" y="950">130</text>
      <text x="972" y="1000" font-size="36" font-weight="700" fill="#263332">Temperature (°C)</text>
    </g>

    <g>
      <text x="30" y="305" font-size="38" font-weight="700">Psychrophiles</text>
      <text x="30" y="344" font-size="30" fill="#52615f">optimum ≤15 °C</text>
      <rect x="300" y="280" width="288" height="54" rx="27" fill="url(#psy)" stroke="#527f84" stroke-width="3"/>
      <line x1="396" y1="307" x2="540" y2="307" stroke="#527f84" stroke-width="14" stroke-linecap="round"/>

      <text x="72" y="475" font-size="40" font-weight="700">Mesophiles</text>
      <text x="72" y="514" font-size="30" fill="#52615f">optimum ≈20–45 °C</text>
      <rect x="444" y="450" width="384" height="54" rx="27" fill="url(#mes)" stroke="#607c5c" stroke-width="3"/>
      <line x1="588" y1="477" x2="828" y2="477" stroke="#607c5c" stroke-width="14" stroke-linecap="round"/>

      <text x="72" y="645" font-size="40" font-weight="700">Thermophiles</text>
      <text x="72" y="684" font-size="30" fill="#52615f">optimum &gt;45–50 °C</text>
      <rect x="732" y="620" width="528" height="54" rx="27" fill="url(#therm)" stroke="#a46d2d" stroke-width="3"/>
      <line x1="828" y1="647" x2="1164" y2="647" stroke="#a46d2d" stroke-width="14" stroke-linecap="round"/>

      <text x="72" y="815" font-size="40" font-weight="700">Hyperthermophiles</text>
      <text x="72" y="854" font-size="30" fill="#52615f">optimum ≥80 °C</text>
      <rect x="1020" y="790" width="547" height="54" rx="27" fill="url(#hyper)" stroke="#88452f" stroke-width="3"/>
      <line x1="1164" y1="817" x2="1452" y2="817" stroke="#88452f" stroke-width="14" stroke-linecap="round"/>
    </g>

    <g>
      <line x1="1567" y1="730" x2="1567" y2="867" stroke="#7f3025" stroke-width="4" stroke-dasharray="10 8"/>
      <circle cx="1567" cy="817" r="16" fill="#ffffff" stroke="#7f3025" stroke-width="7"/>
      <text x="1532" y="700" text-anchor="end" font-size="35" font-weight="700" fill="#7f3025">122 °C</text>
      <text x="1532" y="738" text-anchor="end" font-size="30" fill="#52615f">verified proliferation record</text>
      <text x="1532" y="775" text-anchor="end" font-size="30" fill="#52615f"><tspan font-style="italic">M. kandleri</tspan><tspan>&#160;strain 116 • high-pressure culture, 20 or 40 MPa</tspan></text>
    </g>

    <text x="72" y="1043" font-size="30" fill="#52615f">Schematic ranges overlap; cardinal temperatures depend on the organism and experimental conditions.</text>
  </g>
</svg>
